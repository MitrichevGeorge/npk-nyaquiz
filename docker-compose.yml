services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
    networks:
      - public_net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    command: sh -c "alembic upgrade head && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-4}"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - public_net
      - internal_net
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    env_file:
      - .env
    command: uvicorn admin.main:app --host 0.0.0.0 --port 8001 --workers 1
    ports:
      - "127.0.0.1:${ADMIN_BIND_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - admin_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyaquiz} -d ${POSTGRES_DB:-nyaquiz}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal_net
      - admin_net
    restart: unless-stopped

  whisper:
    build:
      context: ./services/whisper
      dockerfile: Dockerfile
    networks:
      - internal_net
    restart: unless-stopped

  latexocr:
    build:
      context: ./services/latexocr
      dockerfile: Dockerfile
    networks:
      - internal_net
    restart: unless-stopped

volumes:
  pg_data:
  uploads_data:

networks:
  public_net:
  internal_net:
    internal: true
  admin_net:
